[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyerse"
dynamic = ["version"]
description = "Provides algorithms and an API for Portugal Energy Regulator (ERSE)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Diogo Gomes", email = "diogogomes@gmail.com"}]
dependencies = ["requests>=2.32.3,<3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/dgomes/pyerse"
Issues = "https://github.com/dgomes/pyerse/issues"

[project.optional-dependencies]
test = ["pytest>=8.3", "freezegun>=1.5", "pytest-cov>=6"]
dev = ["pyerse[test]", "ruff>=0.11", "build>=1.2", "twine>=6"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["pyerse*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
